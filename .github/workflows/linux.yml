name: Linux checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TERM: xterm-256color
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          mkdir -p /tmp/tfile-ci-logs
          sudo apt-get update 2>&1 | tee /tmp/tfile-ci-logs/apt-update.log
          sudo apt-get install -y build-essential clang libncurses-dev ncurses-term python3 2>&1 | tee /tmp/tfile-ci-logs/apt-install.log
      - name: Clean first run with GCC and Clang
        run: |
          test "$(id -u)" -ne 0
          python3 tests/clean_source_check.py gcc 2>&1 | tee /tmp/tfile-ci-logs/clean-gcc.log
          python3 tests/clean_source_check.py clang 2>&1 | tee /tmp/tfile-ci-logs/clean-clang.log
      - name: Build and full regression (includes architecture)
        run: |
          make -j2 2>&1 | tee /tmp/tfile-ci-logs/build.log
          make -j2 check 2>&1 | tee /tmp/tfile-ci-logs/check.log
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-regression-logs
          path: /tmp/tfile-ci-logs/
          retention-days: 14
  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TERM: xterm-256color
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          mkdir -p /tmp/tfile-ci-logs
          sudo apt-get update 2>&1 | tee /tmp/tfile-ci-logs/apt-update.log
          sudo apt-get install -y build-essential libncurses-dev ncurses-term python3 2>&1 | tee /tmp/tfile-ci-logs/apt-install.log
      - name: ASan UBSan and LSan native
        run: |
          test "$(id -u)" -ne 0
          python3 tests/isolated_check.py python3 tests/run_sanitizers.py --output-directory /tmp/tfile-sanitizers-ci 2>&1 | tee /tmp/tfile-ci-logs/native.log
      - name: Sanitized settings persistence
        run: python3 tests/isolated_check.py env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 make check-settings-sanitize 2>&1 | tee /tmp/tfile-ci-logs/settings.log
      - name: Sanitized media
        run: python3 tests/isolated_check.py python3 tests/run_media_sanitizers.py --output-directory /tmp/tfile-media-sanitizers-ci 2>&1 | tee /tmp/tfile-ci-logs/media.log
      - name: Sanitized terminal and editor PTY
        run: python3 tests/isolated_check.py python3 tests/run_terminal_sanitizers.py --output-directory /tmp/tfile-terminal-sanitizers-ci 2>&1 | tee /tmp/tfile-ci-logs/terminal.log
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-sanitizer-logs
          path: |
            /tmp/tfile-ci-logs/
            /tmp/tfile-sanitizers-ci/*.log
            /tmp/tfile-media-sanitizers-ci/*.log
            /tmp/tfile-terminal-sanitizers-ci/*.log
          retention-days: 14
